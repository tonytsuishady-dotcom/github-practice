<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>饕餮投喂动画 Demo</title>
    <link rel="stylesheet" href="animation-demo.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="stage" aria-label="饕餮投喂动画">
        <header class="stage-header">
          <p>Codex Spirit Companion</p>
          <h1>投喂炼化</h1>
        </header>

        <div class="animation-card">
          <div class="aura-ring"></div>
          <div class="material material-a"></div>
          <div class="material material-b"></div>
          <div class="material material-c"></div>
          <div class="scroll-output">
            <span></span>
            <strong></strong>
          </div>

          <div class="pixel-taotie" aria-label="像素饕餮">
            <i class="slot slot-head"></i>
            <i class="slot slot-charm"></i>
            <i class="slot slot-back"></i>
            <div class="horn left"></div>
            <div class="horn right"></div>
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="head">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
            </div>
            <div class="belly">
              <div class="qi"></div>
            </div>
            <div class="paw left"></div>
            <div class="paw right"></div>
          </div>
        </div>

        <div class="status-line">
          <span>灵材入腹</span>
          <span>炼化灵气</span>
          <span>吐出玉简</span>
        </div>
      </section>
    </main>
  </body>
</html>
