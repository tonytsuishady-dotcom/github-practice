<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="560" viewBox="0 0 1024 560" role="img" aria-labelledby="title desc">
  <title id="title">Taotie Desktop Pet State Sheet</title>
  <desc id="desc">Eight programmatic visual states for the Codex Taotie desktop pet.</desc>
  <defs>
    <style>
      .bg { fill: #fff8e7; }
      .cell { fill: #fffaf0; stroke: #203d3a; stroke-width: 3; }
      .ink { fill: #203d3a; }
      .jade { fill: #3aa0a0; }
      .jade-dark { fill: #2c7f88; }
      .cream { fill: #f7e7bd; }
      .gold { fill: #c8b983; }
      .coral { fill: #dd786f; }
      .cyan { fill: #6eddd7; }
      .danger { fill: #c95757; }
      .label { fill: #203d3a; font: 700 18px "Microsoft YaHei UI", "Segoe UI", sans-serif; }
      .note { fill: #65707f; font: 12px "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    </style>
    <g id="base">
      <ellipse cx="0" cy="82" rx="66" ry="10" fill="#d8c8a8"/>
      <rect x="-74" y="-38" width="148" height="126" rx="38" class="ink"/>
      <rect x="-64" y="-48" width="128" height="118" rx="34" class="jade"/>
      <rect x="-90" y="-8" width="30" height="58" rx="14" class="ink"/>
      <rect x="60" y="-8" width="30" height="58" rx="14" class="ink"/>
      <rect x="-84" y="-2" width="20" height="44" rx="10" class="jade-dark"/>
      <rect x="64" y="-2" width="20" height="44" rx="10" class="jade-dark"/>
      <rect x="-44" y="-96" width="22" height="54" rx="8" class="ink"/>
      <rect x="-38" y="-102" width="14" height="54" rx="6" class="gold"/>
      <rect x="22" y="-96" width="22" height="54" rx="8" class="ink"/>
      <rect x="24" y="-102" width="14" height="54" rx="6" class="gold"/>
      <rect x="-16" y="-72" width="32" height="18" class="gold"/>
      <rect x="-8" y="-66" width="16" height="8" class="cyan"/>
      <rect x="-16" y="44" width="32" height="18" class="gold"/>
      <rect x="-8" y="50" width="16" height="8" class="cyan"/>
      <rect x="-44" y="26" width="88" height="64" rx="26" class="ink"/>
      <rect x="-34" y="34" width="68" height="50" rx="20" class="cream"/>
      <rect x="-58" y="86" width="46" height="24" rx="12" class="ink"/>
      <rect x="12" y="86" width="46" height="24" rx="12" class="ink"/>
      <rect x="-50" y="90" width="32" height="16" rx="8" class="jade-dark"/>
      <rect x="18" y="90" width="32" height="16" rx="8" class="jade-dark"/>
      <rect x="-54" y="-6" width="18" height="18" class="coral"/>
      <rect x="36" y="-6" width="18" height="18" class="coral"/>
      <rect x="-46" y="-20" width="20" height="24" class="ink"/>
      <rect x="26" y="-20" width="20" height="24" class="ink"/>
      <rect x="-39" y="-16" width="6" height="7" fill="#ffffff"/>
      <rect x="33" y="-16" width="6" height="7" fill="#ffffff"/>
      <rect x="-26" y="18" width="52" height="10" class="ink"/>
      <rect x="-13" y="28" width="26" height="10" fill="#f3a0a9"/>
    </g>
    <g id="jade-slip">
      <rect x="-34" y="-8" width="68" height="16" rx="4" class="ink"/>
      <rect x="-28" y="-4" width="56" height="8" rx="3" class="cream"/>
    </g>
  </defs>
  <rect width="1024" height="560" class="bg"/>

  <g transform="translate(0 0)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 138)"/>
    <text x="34" y="234" class="label">待机呼吸</text>
    <text x="34" y="250" class="note">idle</text>
  </g>

  <g transform="translate(256 0)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 140)"/>
    <use href="#jade-slip" transform="translate(134 230)"/>
    <rect x="70" y="202" width="14" height="14" class="gold"/>
    <rect x="182" y="198" width="14" height="14" class="cyan"/>
    <text x="122" y="204" class="label">哒</text>
    <text x="34" y="234" class="label">敲玉简</text>
    <text x="34" y="250" class="note">typing</text>
  </g>

  <g transform="translate(512 0)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 130)"/>
    <text x="96" y="58" class="label">精神 +1</text>
    <rect x="80" y="108" width="20" height="20" class="cyan"/>
    <rect x="168" y="108" width="20" height="20" class="cyan"/>
    <text x="34" y="234" class="label">被摸醒</text>
    <text x="34" y="250" class="note">clicking</text>
  </g>

  <g transform="translate(768 0)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 140)"/>
    <rect x="116" y="58" width="28" height="28" class="gold"/>
    <rect x="123" y="65" width="14" height="14" fill="#ffffff"/>
    <rect x="108" y="156" width="58" height="26" class="ink"/>
    <text x="34" y="234" class="label">吞灵材</text>
    <text x="34" y="250" class="note">eating</text>
  </g>

  <g transform="translate(0 280)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 138)"/>
    <circle cx="134" cy="202" r="24" class="cyan"/>
    <rect x="94" y="190" width="9" height="9" class="cyan"/>
    <rect x="170" y="184" width="9" height="9" class="cyan"/>
    <rect x="128" y="168" width="9" height="9" class="gold"/>
    <text x="34" y="234" class="label">炼化中</text>
    <text x="34" y="250" class="note">digesting</text>
  </g>

  <g transform="translate(256 280)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <circle cx="134" cy="138" r="92" fill="none" stroke="#6eddd7" stroke-width="8"/>
    <path d="M62 92 C102 34 164 34 204 92" fill="none" stroke="#c8b983" stroke-width="8"/>
    <use href="#base" transform="translate(134 138)"/>
    <circle cx="134" cy="202" r="25" class="cyan"/>
    <text x="34" y="234" class="label">发光开心</text>
    <text x="34" y="250" class="note">happy</text>
  </g>

  <g transform="translate(512 280)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 146)" opacity="0.82"/>
    <rect x="88" y="124" width="30" height="8" class="ink"/>
    <rect x="158" y="124" width="30" height="8" class="ink"/>
    <rect x="124" y="164" width="28" height="7" class="danger"/>
    <text x="34" y="234" class="label">灵脉偏低</text>
    <text x="34" y="250" class="note">low_energy</text>
  </g>

  <g transform="translate(768 280)">
    <rect x="18" y="18" width="232" height="244" class="cell"/>
    <use href="#base" transform="translate(134 148) rotate(-2)"/>
    <rect x="86" y="126" width="34" height="8" class="ink"/>
    <rect x="154" y="126" width="34" height="8" class="ink"/>
    <text x="180" y="88" class="label">Z</text>
    <text x="198" y="66" class="note">z</text>
    <text x="34" y="234" class="label">打坐犯困</text>
    <text x="34" y="250" class="note">sleeping</text>
  </g>
</svg>
